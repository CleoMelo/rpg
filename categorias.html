<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categorias</title>
  <link rel="stylesheet" href="styles.css?v=20260731-1">
  <link rel="stylesheet" href="css/filtros.css?v=20260824-1">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">ARQUIVO <span>RPG</span></a>
    <nav class="nav-links">
      <a id="changeAccess" href="#">Trocar acesso</a>
      <a href="index.html">Trocar campanha</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="section-title">
      <span class="eyebrow" id="roleBadge">Acesso</span>
      <h1 id="campaignName" style="font-size:clamp(2.4rem,6vw,4.6rem)">Campanha</h1>
      <p>Selecione uma categoria para visualizar os personagens.</p>
    </section>

    <div id="pageMessage" class="message" aria-live="polite"></div>

    <section>
      <div class="toolbar">
        <h2>Categorias</h2>
        <div class="master-toolbar">
          <button id="addCategoryButton" class="btn" type="button" style="display:none">+ Criar categoria</button>
          <button id="editCampaignButton" class="btn secondary" type="button" style="display:none">✎ Editar campanha</button>
          <button id="deleteCampaignButton" class="btn danger" type="button" style="display:none">Excluir campanha</button>
        </div>
      </div>
      <div class="filter-panel category-filter-panel">
        <div class="filter-field filter-field-grow">
          <label for="categorySearch">Pesquisar categorias</label>
          <div class="search-input">
            <span aria-hidden="true">⌕</span>
            <input
              id="categorySearch"
              type="search"
              autocomplete="off"
              placeholder="Nome ou descrição da categoria"
            >
          </div>
        </div>
        <button id="clearCategorySearch" class="btn secondary filter-clear" type="button">
          Limpar
        </button>
        <p id="categoryFilterStatus" class="filter-status" aria-live="polite"></p>
      </div>
      <div id="categoryGrid" class="grid category-grid"></div>
    </section>

    <section id="charactersSection" style="margin-top:54px">
      <div class="toolbar">
        <div>
          <h2 id="selectedCategoryTitle">Selecione uma categoria</h2>
          <p id="selectedCategoryDescription" class="muted"></p>
        </div>
        <div class="master-toolbar">
          <button id="addSubcategoryButton" class="btn secondary" type="button" style="display:none">+ Criar tier</button>
          <button id="addCharacterButton" class="btn" type="button" style="display:none">+ Adicionar personagem</button>
        </div>
      </div>
      <div id="characterFilters" class="filter-panel character-filter-panel">
        <div class="filter-field filter-field-grow">
          <label for="characterSearch">Pesquisar personagens</label>
          <div class="search-input">
            <span aria-hidden="true">⌕</span>
            <input
              id="characterSearch"
              type="search"
              autocomplete="off"
              placeholder="Nome, descrição ou tier"
            >
          </div>
        </div>
        <div class="filter-field">
          <label for="characterTierFilter">Tier</label>
          <select id="characterTierFilter">
            <option value="all">Todos os tiers</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="characterVisibilityFilter">Visibilidade</label>
          <select id="characterVisibilityFilter">
            <option value="all">Todas</option>
            <option value="visible">Visíveis</option>
            <option value="hidden">Ocultas</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="characterOrderFilter">Ordenação</label>
          <select id="characterOrderFilter">
            <option value="ordem">Ordem personalizada</option>
            <option value="nome">Nome</option>
          </select>
        </div>
        <button id="clearCharacterFilters" class="btn secondary filter-clear" type="button">
          Limpar
        </button>
        <p id="characterFilterStatus" class="filter-status" aria-live="polite"></p>
      </div>
      <div id="characterGrid" class="grid character-grid"></div>
    </section>
  </main>

  <div id="modalRoot"></div>

  <script src="supabase-config.js?v=20260824-1"></script>
  <script src="data.js?v=20260824-1"></script>
  <script src="media-upload.js?v=20260824-1"></script>
</body>
</html>
