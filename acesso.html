<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escolher acesso</title>
  <link rel="stylesheet" href="styles.css?v=20260728-4">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">ARQUIVO <span>RPG</span></a>
    <nav class="nav-links"><a href="index.html">Trocar campanha</a></nav>
  </header>

  <main class="page-shell role-layout">
    <section class="card role-panel">
      <span class="eyebrow">Tipo de acesso</span>
      <h2 id="campaignName">Campanha</h2>
      <p class="lead">Escolha como deseja entrar. Jogadores podem visualizar os personagens. Mestres também podem cadastrar e remover registros.</p>
      <div class="role-options">
        <button class="role-button" id="playerButton">
          <strong>🎲 Jogador</strong>
          <span>Acessar categorias e visualizar personagens.</span>
        </button>
        <button class="role-button" id="masterButton">
          <strong>👑 Mestre</strong>
          <span>Entrar com senha para administrar o conteúdo.</span>
        </button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260728-4"></script>
  <script src="data.js?v=20260728-4"></script>
  <script>
    const rpgId = getSelectedRpg();
    setSelectedRpg(rpgId);

    async function initializeAccessPage() {
      try {
        const rpg = await getRpgById(rpgId);
        document.getElementById('campaignName').textContent = rpg?.name || 'Campanha';
      } catch (error) {
        console.error(error);
        document.getElementById('campaignName').textContent = 'Campanha';
      }
    }

    document.getElementById('playerButton').onclick = () => {
      clearMasterSession(rpgId);
      sessionStorage.setItem('role', 'player');
      location.href = `categorias.html?rpg=${encodeURIComponent(rpgId)}`;
    };

    document.getElementById('masterButton').onclick = () => {
      location.href = `mestre.html?rpg=${encodeURIComponent(rpgId)}`;
    };

    initializeAccessPage();
  </script>
</body>
</html>
