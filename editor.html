<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso do editor</title>
  <link rel="stylesheet" href="styles.css?v=20260903-1">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">ARQUIVO <span>RPG</span></a>
    <nav class="nav-links"><a id="backLink" href="acesso.html">Voltar</a></nav>
  </header>

  <main class="page-shell">
    <section class="card form-panel">
      <span class="eyebrow">Acesso de edição</span>
      <h2>Entrar como editor</h2>
      <p class="muted">Este acesso permite editar personagens públicos e a linha do tempo, sem revelar conteúdo exclusivo do mestre.</p>
      <form id="editorForm">
        <div class="form-group">
          <label for="password">Senha do editor</label>
          <input id="password" type="password" autocomplete="current-password" required placeholder="Digite a senha do editor">
        </div>
        <button class="btn full" type="submit">Entrar como editor</button>
        <div id="message" class="message"></div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260903-1"></script>
  <script src="data.js?v=20260903-1"></script>
  <script>
    const rpgId = getSelectedRpg();
    document.getElementById('backLink').href = `acesso.html?rpg=${encodeURIComponent(rpgId)}`;
    document.getElementById('editorForm').addEventListener('submit', async event => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const message = document.getElementById('message');
      const submitButton = event.currentTarget.querySelector('button[type="submit"]');

      message.className = 'message';
      message.textContent = 'Verificando...';
      submitButton.disabled = true;

      try {
        const token = await authenticateEditor(rpgId, password);
        if (token) {
          message.className = 'message success';
          message.textContent = 'Acesso de editor liberado.';
          location.href = `categorias.html?rpg=${encodeURIComponent(rpgId)}`;
        } else {
          message.className = 'message error';
          message.textContent = 'Senha do editor incorreta ou ainda não configurada.';
        }
      } catch (error) {
        console.error(error);
        message.className = 'message error';
        message.textContent = error?.code === 'PGRST202'
          ? 'Execute a migration de acesso do editor no Supabase.'
          : 'Não foi possível verificar a senha do editor.';
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
