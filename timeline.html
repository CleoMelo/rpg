<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline — Arquivo RPG</title><link rel="stylesheet" href="styles.css?v=20260731-1">
<style>
.timeline-page{max-width:1500px;margin:auto;padding:32px 22px 70px}.toolbar,.subbar,.event-form,.modal-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar{justify-content:space-between;margin-bottom:18px}.toolbar h1{margin:0}.muted{color:var(--muted,#9ca3af)}.views{display:flex;gap:4px}.views button.active{background:rgba(143,107,255,.22);border-color:#8f6bff}.timeline-card{overflow:hidden}.timeline-top{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.1)}.subbar{justify-content:space-between}.timeline-scroll{overflow:hidden;position:relative;cursor:grab}.timeline-scroll.dragging{cursor:grabbing}.gantt{min-width:900px}.gantt-head,.gantt-row{display:grid;grid-template-columns:250px 1fr}.gantt-head{height:70px}.name-head{border-right:1px solid rgba(255,255,255,.1)}.axis{position:relative;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.12);background:repeating-linear-gradient(to right,transparent 0,transparent calc(10% - 1px),rgba(255,255,255,.09) calc(10% - 1px),rgba(255,255,255,.09) 10%)}.axis-label{position:absolute;top:14px;transform:translateX(-50%);font-weight:700;font-size:.82rem;white-space:nowrap}.gantt-row{min-height:64px}.event-name{padding:12px 16px;display:flex;align-items:center;gap:9px;border-top:1px solid rgba(255,255,255,.07);border-right:1px solid rgba(255,255,255,.1);overflow:hidden}.event-name span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{position:relative;border-top:1px solid rgba(255,255,255,.07);background:repeating-linear-gradient(to right,transparent 0,transparent calc(10% - 1px),rgba(255,255,255,.055) calc(10% - 1px),rgba(255,255,255,.055) 10%)}.bar{position:absolute;top:18px;height:29px;border:0;border-radius:7px;padding:0 9px;color:#fff;box-shadow:0 4px 13px rgba(0,0,0,.25);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:8px}.bar:hover{filter:brightness(1.13);outline:2px solid rgba(255,255,255,.22)}.empty{padding:50px;text-align:center;color:var(--muted,#999)}.bottom-tools{padding:12px 18px;border-top:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.zoom{display:flex;gap:6px;align-items:center}.zoom input{width:130px}.list-view{padding:18px}.list-item{display:grid;grid-template-columns:180px 1fr auto;gap:15px;padding:15px 5px;border-bottom:1px solid rgba(255,255,255,.08);align-items:center}.calendar{padding:18px}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid rgba(255,255,255,.1)}.day-head,.day{min-height:100px;padding:8px;border-right:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07)}.day-head{min-height:auto;text-align:center;font-size:.78rem;font-weight:700}.day.out{opacity:.35}.day-num{font-weight:700}.cal-event{display:block;margin-top:6px;padding:3px 6px;border-radius:4px;font-size:.72rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modal-box{width:min(650px,100%);max-height:90vh;overflow:auto;padding:22px}.modal-box h2{margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}.form-grid label{display:block;font-size:.8rem;font-weight:700;margin-bottom:5px}.form-grid input,.form-grid select,.form-grid textarea{width:100%;box-sizing:border-box}.form-grid textarea{min-height:100px;resize:vertical}.color-row{display:flex;gap:8px;flex-wrap:wrap}.color-row button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}.color-row button.selected{border-color:#fff;outline:2px solid #8f6bff}.hidden{display:none!important}@media(max-width:800px){.gantt-head,.gantt-row{grid-template-columns:180px 1fr}.list-item{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.day{min-height:80px;padding:5px}}
</style></head>
<body>
<header class="site-header"><a class="brand" href="index.html">ARQUIVO <span>RPG</span></a><nav class="nav-links"><a href="index.html">Voltar</a></nav></header>
<main class="timeline-page">
<div class="toolbar"><div><span class="eyebrow">Ferramenta de teste</span><h1>Timeline</h1><p class="muted">Gantt, cronologia e calendário em uma mesma linha do tempo.</p></div><div class="toolbar"><button class="btn" id="newTimeline">+ Timeline</button><button class="btn secondary" id="newEvent">+ Evento</button><button class="btn secondary" id="exportBtn">Exportar</button><button class="btn secondary" id="importBtn">Importar</button><input id="fileInput" type="file" accept="application/json" class="hidden"></div></div>
<section class="card timeline-card"><div class="timeline-top"><div class="subbar"><div><select id="timelineSelect"></select> <button class="btn secondary" id="renameBtn">Renomear</button> <button class="btn secondary" id="deleteBtn">Excluir</button></div><div class="views"><button class="btn secondary active" data-view="gantt">Gantt</button><button class="btn secondary" data-view="list">Lista</button><button class="btn secondary" data-view="calendar">Calendário</button></div></div></div>
<div id="view"></div><div class="bottom-tools"><div class="zoom"><button class="btn secondary" id="zoomOut">−</button><input id="zoomRange" type="range" min="20" max="400" value="100"><button class="btn secondary" id="zoomIn">+</button><span id="zoomText" class="muted">100%</span></div><span id="eventCount" class="muted"></span></div></section>
</main>
<div class="modal" id="modal"><div class="card modal-box"><h2 id="modalTitle">Novo evento</h2><form id="eventForm"><div class="form-grid"><div class="full"><label>Nome</label><input id="fName" maxlength="120" required></div><div><label>Início</label><input id="fStart" type="datetime-local" required></div><div><label>Fim</label><input id="fEnd" type="datetime-local"></div><div><label>Grupo</label><input id="fGroup" maxlength="60" placeholder="Ex.: Guerras"></div><div><label>Ícone</label><input id="fIcon" maxlength="4" placeholder="⚔️"></div><div class="full"><label>Descrição</label><textarea id="fDesc" placeholder="Detalhes do evento..."></textarea></div><div class="full"><label>Cor</label><div class="color-row" id="colors"></div></div></div><div class="modal-actions"><button class="btn" type="submit">Salvar</button><button class="btn secondary" type="button" id="closeModal">Cancelar</button><button class="btn secondary hidden" type="button" id="removeEvent">Excluir evento</button></div></form></div></div>
<script>
const KEY='arquivo-rpg.timelines.test.v3';
const COLORS=['#8f6bff','#4f9cff','#e35d8f','#d89b3c','#36a269','#c45cff','#ef6f3e','#64748b'];
const DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DEFAULT={timelines:[{id:'t1',name:'Linha do tempo principal',events:[
{id:'e1',name:'Guerra das Cinzas',start:'3206-01-01T00:00',end:'3207-09-01T00:00',group:'Guerras',icon:'⚔️',color:COLORS[0],desc:''},
{id:'e2',name:'Reinado de Kael',start:'3206-10-01T00:00',end:'3208-07-01T00:00',group:'Política',icon:'👑',color:COLORS[1],desc:''},
{id:'e3',name:'Construção da cidade',start:'3206-11-01T00:00',end:'3207-06-01T00:00',group:'Cidades',icon:'🏛️',color:COLORS[4],desc:''},
{id:'e4',name:'Queda de Asteria',start:'3208-05-01T00:00',end:'3208-11-01T00:00',group:'Guerras',icon:'🔥',color:COLORS[2],desc:''}]}]};
let data=load(),active=data.timelines[0]?.id,viewMode='gantt',zoom=100,pan=0,editing=null,calendarDate=new Date(3206,0,1);
const $=id=>document.getElementById(id);function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x?.timelines?.length)return x}catch(e){}return structuredClone(DEFAULT)}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function tl(){return data.timelines.find(t=>t.id===active)||data.timelines[0]}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateVal(s){return new Date(s).getTime()}function fmt(s){return new Date(s).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}
function range(){const ev=tl().events;if(!ev.length)return [new Date(3206,0,1).getTime(),new Date(3209,0,1).getTime()];let a=Math.min(...ev.map(e=>dateVal(e.start))),b=Math.max(...ev.map(e=>dateVal(e.end||e.start)));const pad=Math.max(86400000*30,(b-a)*.08);return [a-pad,b+pad]}
function render(){renderSelect();$('eventCount').textContent=`${tl().events.length} evento(s) · ${tl().name}`;if(viewMode==='gantt')renderGantt();else if(viewMode==='list')renderList();else renderCalendar()}
function renderSelect(){$('timelineSelect').innerHTML=data.timelines.map(t=>`<option value="${esc(t.id)}" ${t.id===active?'selected':''}>${esc(t.name)}</option>`).join('')}
function renderGantt(){const box=$('view'),events=tl().events,[a,b]=range(),span=b-a,scale=zoom/100,world=Math.max(900,Math.round(1100*scale));let ticks=12;let axis='';for(let i=0;i<=ticks;i++){const x=i/ticks*100;const d=new Date(a+span*i/ticks);axis+=`<span class="axis-label" style="left:${x}%">${d.getFullYear()}${i===ticks?'':' '}</span>`}let rows=events.map(e=>{let x=Math.max(0,(dateVal(e.start)-a)/span*100),w=Math.max(.8,((dateVal(e.end||e.start)-dateVal(e.start))/span*100));if(dateVal(e.end||e.start)<=dateVal(e.start))w=.9;return `<div class="event-name"><span>${esc(e.icon||'•')}</span><span title="${esc(e.desc)}">${esc(e.name)}</span></div><div class="track"><button class="bar" data-edit="${e.id}" style="left:${x}%;width:${Math.min(100-x,w)}%;background:${esc(e.color||COLORS[0])}">${esc(e.name)}</button></div>`}).join('');box.innerHTML=`<div class="timeline-scroll" id="ganttScroll"><div class="gantt" style="width:${world}px"><div class="gantt-head"><div class="name-head"></div><div class="axis">${axis}</div></div>${rows||'<div class="empty">Nenhum evento. Use “+ Evento” ou ative a criação por arrasto.</div>'}</div></div>`;box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEvent(b.dataset.edit));const sc=$('ganttScroll');sc.scrollLeft=Math.max(0,pan);sc.onwheel=e=>{e.preventDefault();const old=zoom;zoom=Math.max(20,Math.min(400,zoom*(e.deltaY<0?1.15:.87)));pan=Math.max(0,sc.scrollLeft*(zoom/old));$('zoomRange').value=zoom;renderGantt();};let down=false,sx=0,sl=0;sc.onpointerdown=e=>{down=true;sx=e.clientX;sl=sc.scrollLeft;sc.classList.add('dragging');sc.setPointerCapture(e.pointerId)};sc.onpointermove=e=>{if(down){sc.scrollLeft=sl-(e.clientX-sx);pan=sc.scrollLeft}};sc.onpointerup=()=>{down=false;sc.classList.remove('dragging')};sc.ondblclick=e=>{if(e.target.closest('.bar')||e.target.closest('.event-name'))return;const r=sc.querySelector('.track')?.getBoundingClientRect();if(r)openEvent(null,Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),a,b)}}
function renderList(){const events=[...tl().events].sort((a,b)=>dateVal(a.start)-dateVal(b.start));$('view').innerHTML=`<div class="list-view">${events.map(e=>`<div class="list-item"><div class="muted">${fmt(e.start)}${e.end?' → '+fmt(e.end):''}</div><div><strong>${esc(e.icon||'')} ${esc(e.name)}</strong><div class="muted">${esc(e.group||'Sem grupo')} · ${esc(e.desc||'Sem descrição')}</div></div><button class="btn secondary" data-edit="${e.id}">Editar</button></div>`).join('')||'<div class="empty">Nenhum evento.</div>'}</div>`;$('view').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEvent(b.dataset.edit))}
function renderCalendar(){const y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),start=first.getDay(),days=last.getDate();let cells='';for(let i=0;i<start;i++)cells+='<div class="day out"></div>';for(let d=1;d<=days;d++){const date=new Date(y,m,d);const ds=date.toISOString().slice(0,10);const ev=tl().events.filter(e=>e.start.slice(0,10)<=ds&&(e.end?e.end.slice(0,10)>=ds:true));cells+=`<div class="day" data-day="${ds}"><div class="day-num">${d}</div>${ev.map(e=>`<button class="cal-event" data-edit="${e.id}" style="background:${esc(e.color)}">${esc(e.icon||'')} ${esc(e.name)}</button>`).join('')}</div>`}$('view').innerHTML=`<div class="calendar"><div class="cal-head"><button class="btn secondary" id="prevMonth">‹</button><strong>${calendarDate.toLocaleString('pt-BR',{month:'long',year:'numeric'})}</strong><button class="btn secondary" id="nextMonth">›</button></div><div class="cal-grid">${DAYS.map(d=>`<div class="day-head">${d}</div>`).join('')}${cells}</div></div>`;$('prevMonth').onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()-1);renderCalendar()};$('nextMonth').onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()+1);renderCalendar()};$('view').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEvent(b.dataset.edit));$('view').querySelectorAll('[data-day]').forEach(d=>d.ondblclick=()=>openEvent(null,d.dataset.day))}
function openEvent(id,ratio,a,b){editing=id;const e=id?tl().events.find(x=>x.id===id):null;$('modalTitle').textContent=e?'Editar evento':'Novo evento';$('fName').value=e?.name||'';$('fStart').value=e?.start||((ratio!=null)?new Date(a+(b-a)*ratio).toISOString().slice(0,16):'');$('fEnd').value=e?.end||'';$('fGroup').value=e?.group||'';$('fIcon').value=e?.icon||'';$('fDesc').value=e?.desc||'';document.querySelectorAll('.color-row button').forEach(b=>b.classList.toggle('selected',b.dataset.color===(e?.color||COLORS[0])));$('removeEvent').classList.toggle('hidden',!e);$('modal').classList.add('open');}
function close(){editing=null;$('modal').classList.remove('open')}
$('eventForm').onsubmit=e=>{e.preventDefault();const t=tl(),obj={name:$('fName').value.trim(),start:$('fStart').value,end:$('fEnd').value,group:$('fGroup').value.trim(),icon:$('fIcon').value.trim(),desc:$('fDesc').value.trim(),color:document.querySelector('.color-row button.selected')?.dataset.color||COLORS[0]};if(!obj.name||!obj.start)return;if(obj.end&&dateVal(obj.end)<dateVal(obj.start)){alert('O fim não pode ser anterior ao início.');return}if(editing){Object.assign(t.events.find(x=>x.id===editing),obj)}else t.events.push({id:uid(),...obj});save();close();render()};
$('removeEvent').onclick=()=>{if(!editing)return;if(confirm('Excluir este evento?')){tl().events=tl().events.filter(e=>e.id!==editing);save();close();render()}};$('closeModal').onclick=close;$('modal').onclick=e=>{if(e.target.id==='modal')close()};
COLORS.forEach(c=>{const b=document.createElement('button');b.type='button';b.dataset.color=c;b.style.background=c;b.onclick=()=>{document.querySelectorAll('.color-row button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('colors').appendChild(b)});
$('timelineSelect').onchange=e=>{active=e.target.value;pan=0;render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{viewMode=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()});$('newEvent').onclick=()=>openEvent(null);$('newTimeline').onclick=()=>{const n=prompt('Nome da nova timeline:','Nova timeline');if(!n?.trim())return;const t={id:uid(),name:n.trim(),events:[]};data.timelines.push(t);active=t.id;save();render()};$('renameBtn').onclick=()=>{const t=tl(),n=prompt('Nome da timeline:',t.name);if(n?.trim()){t.name=n.trim();save();render()}};$('deleteBtn').onclick=()=>{if(data.timelines.length===1)return;if(confirm('Excluir esta timeline?')){data.timelines=data.timelines.filter(t=>t.id!==active);active=data.timelines[0].id;save();render()}};
function setZoom(v){zoom=Number(v);$('zoomRange').value=zoom;$('zoomText').textContent=zoom+'%';renderGantt()}$('zoomRange').oninput=e=>setZoom(e.target.value);$('zoomIn').onclick=()=>setZoom(Math.min(400,zoom+20));$('zoomOut').onclick=()=>setZoom(Math.max(20,zoom-20));
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='timeline-arquivo-rpg.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x.timelines)||!x.timelines.length)throw Error();data=x;active=data.timelines[0].id;save();render()}catch{alert('Arquivo de timeline inválido.')}};
$('zoomText').textContent='100%';render();
</script></body></html>
