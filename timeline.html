<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timeline Gantt</title><link rel="stylesheet" href="styles.css"><style>
.timeline-page{max-width:1500px;margin:auto;padding:30px}.gantt-box{overflow:auto;background:#111827;border-radius:12px;padding:20px}.header,.row{display:grid;grid-template-columns:280px 1fr}.header{height:70px}.axis{position:relative;border-bottom:1px solid #555}.year{position:absolute;top:5px;transform:translateX(-50%)}.row{height:65px}.name{display:flex;align-items:center;background:#111827;border-top:1px solid #333;padding-left:12px;z-index:3}.track{position:relative;border-top:1px solid #333}.bar{position:absolute;top:17px;height:30px;border-radius:8px;color:white;padding:5px 10px;cursor:grab;overflow:hidden}.group{margin:25px 0;font-weight:bold}.controls{display:flex;gap:10px;margin:20px 0}.hidden{display:none}.event-form input{margin:5px;width:180px}</style></head>
<body><header class="site-header"><a class="brand" href="index.html">ARQUIVO <span>RPG</span></a></header><main class="timeline-page"><h1>Timeline Gantt</h1><input id="search" placeholder="Pesquisar evento"><button id="add">Novo evento</button><div id="form" class="hidden event-form"><input id="n" placeholder="Nome"><input id="s" placeholder="Inicio"><input id="e" placeholder="Fim"><input id="g" placeholder="Grupo"><input id="c" placeholder="Cor"><button id="save">Salvar</button></div><section class="gantt-box"><div id="gantt"></div></section></main>
<script>
const KEY='timeline-gantt-local';let events=JSON.parse(localStorage.getItem(KEY)||'[]');if(!events.length)events=[{name:'Guerra das Cinzas',start:3206,end:3207,group:'Guerras',color:'#ef4444'},{name:'Reinado de Kael',start:3206,end:3208,group:'Politica',color:'#eab308'}];
let edit=null;const saveDB=()=>localStorage.setItem(KEY,JSON.stringify(events));
function render(){let filter=search.value.toLowerCase();let list=events.filter(e=>e.name.toLowerCase().includes(filter));let min=Math.min(...list.map(e=>e.start)),max=Math.max(...list.map(e=>e.end))+1;let h='<div class="header"><div></div><div class="axis">';for(let y=min;y<=max;y++)h+=`<span class="year" style="left:${(y-min)/(max-min)*100}%">${y}</span>`;h+='</div></div>';list.forEach((e,i)=>{let l=(e.start-min)/(max-min)*100,w=Math.max(3,(e.end-e.start+1)/(max-min)*100);h+=`<div class="row"><div class="name">${e.group||'Eventos'} - ${e.name}</div><div class="track"><div class="bar" draggable="true" style="left:${l}%;width:${w}%;background:${e.color||'#8f6bff'}" data-id="${i}">${e.name}</div></div></div>`});gantt.innerHTML=h;document.querySelectorAll('.bar').forEach(b=>b.ondblclick=()=>{edit=Number(b.dataset.id);let e=events[edit];n.value=e.name;s.value=e.start;e.value=e.end;g.value=e.group;c.value=e.color;form.classList.remove('hidden')})}
add.onclick=()=>form.classList.remove('hidden');search.oninput=render;save.onclick=()=>{let e={name:n.value,start:Number(s.value),end:Number(e.value||s.value),group:g.value,color:c.value||'#8f6bff'};if(edit!==null){events[edit]=e;edit=null}else events.push(e);saveDB();form.classList.add('hidden');render()};saveDB();render();
</script></body></html>
