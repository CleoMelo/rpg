<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline Gantt — Arquivo RPG</title>
<link rel="stylesheet" href="styles.css">
<style>
.timeline-page{max-width:1500px;margin:auto;padding:32px 22px}.timeline-head{margin-bottom:25px}.gantt-box{overflow:auto;background:#111827;border-radius:12px;padding:20px}.gantt{min-width:1000px}.header,.row{display:grid;grid-template-columns:260px 1fr}.header{height:80px}.title-space{border-right:1px solid #374151}.axis{position:relative;border-bottom:1px solid #374151;padding-top:35px}.year{position:absolute;top:8px;transform:translateX(-50%);font-weight:bold}.row{min-height:64px}.name{display:flex;align-items:center;padding:0 15px;border-right:1px solid #374151;border-top:1px solid #273244;font-weight:600;z-index:2;background:#111827}.track{position:relative;border-top:1px solid #273244;background:repeating-linear-gradient(90deg,transparent 0,transparent 9.9%,#273244 10%)}.bar{position:absolute;top:17px;height:30px;border-radius:8px;color:white;border:0;padding:0 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.controls{display:flex;gap:10px;margin-bottom:20px}.modal{margin-top:20px}.hidden{display:none}.form input{margin:5px;width:220px}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html">ARQUIVO <span>RPG</span></a></header>
<main class="timeline-page">
<div class="timeline-head"><h1>Timeline Gantt</h1><p>Visualização cronológica editável salva localmente.</p></div>
<div class="controls"><button class="btn" id="add">+ Evento</button></div>
<section class="gantt-box"><div id="gantt"></div></section>
<div id="form" class="modal hidden"><input id="name" placeholder="Nome"><input id="start" placeholder="Ano inicial"><input id="end" placeholder="Ano final"><button class="btn" id="save">Salvar</button></div>
</main>
<script>
const KEY='timeline-gantt-local';
let events=JSON.parse(localStorage.getItem(KEY)||'null')||[
{name:'Guerra das Cinzas',start:3206,end:3207},
{name:'Reinado de Kael',start:3206,end:3208},
{name:'Construção da cidade',start:3206,end:3207},
{name:'Queda de Asteria',start:3208,end:3208}
];
function save(){localStorage.setItem(KEY,JSON.stringify(events));render()}
function render(){let min=Math.min(...events.map(e=>e.start)),max=Math.max(...events.map(e=>e.end))+1;let html='<div class="gantt"><div class="header"><div class="title-space"></div><div class="axis">';for(let y=min;y<=max;y++)html+=`<span class="year" style="left:${(y-min)/(max-min)*100}%">${y}</span>`;html+='</div></div>';for(const e of events){let left=(e.start-min)/(max-min)*100;let width=Math.max(5,(e.end-e.start+1)/(max-min)*100);html+=`<div class="row"><div class="name">${e.name}</div><div class="track"><div class="bar" style="left:${left}%;width:${width}%;background:#8f6bff">${e.name}</div></div></div>`}html+='</div>';document.getElementById('gantt').innerHTML=html}
add.onclick=()=>form.classList.remove('hidden');save.onclick=()=>{events.push({name:name.value,start:Number(start.value),end:Number(end.value)||Number(start.value)});form.classList.add('hidden');save()};render();
</script>
</body>
</html>
