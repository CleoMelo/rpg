<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trocar senha do mestre</title>
  <link rel="stylesheet" href="styles.css?v=20260728-11">
  <link rel="stylesheet" href="css/modais.css?v=20260824-1">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">ARQUIVO <span>RPG</span></a>
    <nav class="nav-links"><a id="backLink" href="mestre.html">Voltar</a></nav>
  </header>

  <main class="page-shell">
    <section class="card form-panel">
      <span class="eyebrow">Segurança</span>
      <h2>Trocar senha do mestre</h2>
      <p class="muted">Informe a senha atual e defina uma nova senha para esta campanha.</p>

      <form id="changePasswordForm">
        <div class="form-group">
          <label for="currentPassword">Senha atual</label>
          <input id="currentPassword" type="password" autocomplete="current-password" required placeholder="Digite a senha atual">
        </div>
        <div class="form-group">
          <label for="newPassword">Nova senha</label>
          <input id="newPassword" type="password" minlength="6" autocomplete="new-password" required placeholder="Pelo menos 6 caracteres">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmar nova senha</label>
          <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required placeholder="Repita a nova senha">
        </div>
        <p id="message" class="message" aria-live="polite"></p>
        <button class="btn full" type="submit">Salvar nova senha</button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260728-4"></script>
  <script src="data.js?v=20260728-18"></script>
  <script>
    const rpgId = getSelectedRpg();
    document.getElementById('backLink').href = `mestre.html?rpg=${encodeURIComponent(rpgId)}`;

    const form = document.getElementById('changePasswordForm');
    const message = document.getElementById('message');
    const submitButton = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      message.className = 'message';
      message.textContent = '';

      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (isDefaultRpg(rpgId)) {
        message.className = 'message error';
        message.textContent = 'Campanhas demonstrativas não permitem trocar a senha.';
        return;
      }

      if (newPassword.length < 6) {
        message.className = 'message error';
        message.textContent = 'A nova senha precisa ter pelo menos 6 caracteres.';
        return;
      }

      if (newPassword !== confirmPassword) {
        message.className = 'message error';
        message.textContent = 'A confirmação da nova senha não confere.';
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Alterando...';

      try {
        const token = await authenticateMaster(rpgId, currentPassword);
        if (!token) {
          message.className = 'message error';
          message.textContent = 'Senha atual incorreta.';
          return;
        }

        const client = getSupabaseClient();
        const { data, error } = await client.rpc('trocar_senha_mestre', {
          p_campanha_id: String(rpgId),
          p_token: token,
          p_senha_atual: currentPassword,
          p_nova_senha: newPassword
        });

        if (error) throw error;
        if (!data) {
          message.className = 'message error';
          message.textContent = 'Não foi possível alterar a senha. Verifique a senha atual.';
          return;
        }

        message.className = 'message success';
        message.textContent = 'Senha alterada com sucesso. Sua sessão de mestre continua ativa.';
        form.reset();
      } catch (error) {
        console.error(error);
        message.className = 'message error';
        message.textContent = error?.code === 'PGRST202'
          ? 'Execute a migração 20260825_trocar_senha_mestre.sql no Supabase.'
          : error?.message || 'Não foi possível alterar a senha.';
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Salvar nova senha';
      }
    });
  </script>
</body>
</html>
